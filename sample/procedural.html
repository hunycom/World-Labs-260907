<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark.js 프로시저럴 & 파티클 스플랫 데모</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #090c10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    .panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      max-width: 360px;
    }
    h1 {
      font-size: 1.15rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .btn-row {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    button:hover {
      background: #0284c7;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="panel">
    <h1>❄️ Spark.js Procedural Particles</h1>
    <p>GPU 상에서 수학적 계산으로 실시간 수만 개의 3D Gaussian Splats를 생성하고 물리 시뮬레이션을 수행합니다.</p>
    <div class="btn-row">
      <button id="btn-grid">3D 가우시안 그리드</button>
      <button id="btn-sphere">스플랫 구체 (Sphere)</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh, PackedSplats, constructGrid, constructSpherePoints } from "@sparkjsdev/spark";

    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    let activeMesh = null;

    function showGrid() {
      if (activeMesh) scene.remove(activeMesh);
      activeMesh = new SplatMesh({
        constructSplats: (splats) => constructGrid({
          splats,
          extents: new THREE.Box3(
            new THREE.Vector3(-3, -2, -3),
            new THREE.Vector3(3, 2, 3)
          ),
          stepSize: 0.5,
          pointRadius: 0.04
        })
      });
      scene.add(activeMesh);
    }

    function showSphere() {
      if (activeMesh) scene.remove(activeMesh);
      activeMesh = new SplatMesh({
        constructSplats: (splats) => constructSpherePoints({
          splats,
          radius: 1.8,
          maxDepth: 4,
          pointRadius: 0.03
        })
      });
      scene.add(activeMesh);
    }

    showSphere();

    document.getElementById("btn-grid").addEventListener("click", showGrid);
    document.getElementById("btn-sphere").addEventListener("click", showSphere);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let lastTime = 0;
    renderer.setAnimationLoop((time) => {
      const delta = (time - lastTime) / 1000;
      lastTime = time;

      if (activeMesh) {
        activeMesh.rotation.y += delta * 0.3;
        activeMesh.rotation.x += delta * 0.1;
      }

      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
